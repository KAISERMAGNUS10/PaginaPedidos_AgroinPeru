<ap-tienda-header />

<main class="container detalle-container">
    <a href="/" class="back-link" id="link-volver-catalogo">← Volver al catálogo</a>

    <div class="product-details">
        <div class="product-image">
            <img id="detalle-img" src="img/logoagroperu.jpg" alt="Producto">
        </div>
        <div class="product-info">
            <span class="detail-badge" id="detalle-categoria">Riego tecnificado</span>
            <h2 id="detalle-nombre">Cargando…</h2>
            <p class="product-measure" id="detalle-medida"></p>
            <div class="detalle-precio-fila">
                <p class="price-large" id="detalle-precio">S/ 0.00</p>
                <span>Precio con IGV · pagas al recoger</span>
            </div>
            <div class="product-packaging">
                <div>
                    <span>Cantidad por caja</span>
                    <strong id="detalle-caja">-</strong>
                </div>
                <div>
                    <span>Cantidad por bolsa</span>
                    <strong id="detalle-bolsa">-</strong>
                </div>
            </div>

            <div class="cart-controls detalle-carrito">
                <button class="btn-add-initial" id="btn-add-main" type="button">Agregar al carrito</button>
                <div class="qty-control" id="qty-control-main" style="display: none;">
                    <button class="qty-btn" id="btn-menos" type="button" aria-label="Quitar uno">−</button>
                    <span class="qty-val" id="qty-val-main">1 un</span>
                    <button class="qty-btn" id="btn-mas" type="button" aria-label="Agregar uno">+</button>
                </div>
            </div>

            <div class="detail-copy-block">
                <span class="detail-copy-title">Descripción</span>
                <p class="description" id="detalle-descripcion"></p>
            </div>

            <div class="contact-actions">
                <a id="link-whatsapp" href="#" target="_blank" rel="noopener" class="btn-contact btn-whatsapp">Cotizar por WhatsApp</a>
                <a id="link-email" href="#" class="btn-contact btn-email">Consultar por correo</a>
            </div>
        </div>
    </div>
</main>
