<!-- CABECERA — idéntica a index.html y producto.html -->
    <header class="navbar-tottus">
        <div class="header-left">
            <a routerLink="/" class="logo-container">
                <img src="img/logoagroperu.jpg" alt="Agroinperu" class="logo-drop">
                <span class="logo-text">
                    <span class="text-blue">AGROIN</span><span class="text-red">PERU</span> <span class="text-blue">S.A.C</span>
                </span>
            </a>
            <button class="btn-menu-tottus" id="btn-main-menu">
                <span>☰</span> Menú
            </button>
        </div>

        <div class="header-search">
            <input type="text" placeholder="Buscar en Agroinperu (conexiones, válvulas, mangueras...)" id="header-search-input">
            <button type="button" class="btn-search" id="btn-header-search">🔍</button>
        </div>

        <div class="header-right">
            <div class="user-session-container">
                <div id="user-trigger" class="user-trigger">
                    <div class="user-text-box">
                        <span class="user-greeting-label">Hola,</span>
                        <span class="user-name-label" id="user-display-name">Inicia sesión ⌄</span>
                    </div>
                </div>

                <div id="user-dropdown-menu" class="user-dropdown-tottus">
                    <p id="dropdown-user-full">Cargando...</p>
                    <a routerLink="/mi-cuenta">Mi cuenta</a>
                    <a routerLink="/mis-pedidos">Mis Pedidos</a>
                    <button id="btn-logout-tottus" class="btn-logout-tottus">Cerrar Sesión</button>
                </div>
            </div>

            <a routerLink="/mi-cuenta" class="nav-extra-link">Mi cuenta</a>
            <a routerLink="/mis-pedidos" class="nav-extra-link">Mis Pedidos</a>

            <div class="notif-bell-container">
                <a href="#" id="notif-bell" class="notif-bell-tottus">🔔<span class="notif-bell-dot" id="notif-bell-dot" style="display:none;"></span></a>
                <div id="notif-dropdown" class="notif-dropdown"></div>
            </div>

            <a href="#" class="cart-tottus">
                🛒 <span class="cart-badge" id="cart-counter">0</span>
            </a>
        </div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>

    <div id="side-menu" class="side-menu">
        <div class="side-menu-header">
            <h2>Categorías</h2>
            <button id="btn-close-menu" class="btn-close-menu">✖</button>
        </div>

        <div class="side-menu-content">
            <label><input type="checkbox" checked> Conexiones HDPE</label>
            <label><input type="checkbox" checked> Válvulas y Portaválvulas</label>
            <label><input type="checkbox"> Aspersores</label>
            <label><input type="checkbox"> Mangueras</label>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL TIPO TOTTUS -->
    <main class="cart-container">
        
        <!-- COLUMNA IZQUIERDA (PRODUCTOS) -->
        <section class="cart-items-section">
            <h2>Carro (<span id="cart-title-qty">0</span> productos)</h2>
            <div class="pickup-badge">
                <span>✔</span> Modalidad: Recojo presencial en tienda
            </div>
            
            <div id="cart-list-container"></div>
        </section>

        <!-- COLUMNA DERECHA (RESUMEN DE PAGO) -->
        <section class="cart-summary-section">
            <h3>Resumen de la orden</h3>
            <div class="summary-row">
                <span>Productos (<span id="summary-qty">0</span>)</span>
                <span id="summary-subtotal">S/ 0.00</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total:</span>
                <span id="summary-total">S/ 0.00</span>
            </div>
            <button class="btn-continue" id="btn-continue-checkout">Continuar compra</button>
        </section>

    </main>
